<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="ShuruKaro App Logo">
  <defs>
    <linearGradient id="emeraldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="45%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Emerald Green App Icon Canvas -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#emeraldBg)" />

  <!-- Subtle Inner Frame Ring -->
  <rect x="18" y="18" width="476" height="476" rx="96" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="4" />

  <!-- Subtle Upward Growth Spark Lines -->
  <path d="M124 190 L124 146 M106 164 L124 142 L142 164" stroke="#FDE68A" stroke-opacity="0.55" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <path d="M388 190 L388 146 M370 164 L388 142 L406 164" stroke="#FDE68A" stroke-opacity="0.55" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Gold Left & Right Rocket Stabilizer Fins -->
  <path d="M188 292 L130 344 C122 351 126 364 137 364 L192 364 Z" fill="url(#goldGrad)" />
  <path d="M324 292 L382 344 C390 351 386 364 375 364 L320 364 Z" fill="url(#goldGrad)" />

  <!-- White Upward Growth Rocket / Arrow Fuselage -->
  <path d="M256 72 L364 196 C370 203 365 214 356 214 L322 214 L322 356 C322 365 315 372 306 372 L206 372 C197 372 190 365 190 356 L190 214 L156 214 C147 214 142 203 148 196 Z" fill="#FFFFFF" />

  <!-- Gold Rocket Tip Accent -->
  <path d="M256 72 L292 114 L220 114 Z" fill="url(#goldGrad)" />

  <!-- Emerald Core Medallion inside Rocket -->
  <circle cx="256" cy="272" r="56" fill="#047857" stroke="#FBBF24" stroke-width="6" />

  <!-- Crisp Vector Rupee Symbol (₹) in White & Gold -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top & Middle Rupee Bars (Gold) -->
    <path d="M234 244 H278" stroke="#FDE68A" stroke-width="10" />
    <path d="M234 263 H278" stroke="#FDE68A" stroke-width="10" />
    <!-- Rupee Curve & Diagonal Leg (White) -->
    <path d="M242 244 C264 244 268 278 242 280 L274 306" stroke="#FFFFFF" stroke-width="10" />
  </g>

  <!-- Gold Propulsion / Growth Flame Chevron -->
  <path d="M220 388 L256 446 L292 388 Z" fill="url(#goldGrad)" />
  <path d="M238 388 L256 420 L274 388 Z" fill="#FFFFFF" fill-opacity="0.9" />
</svg>
